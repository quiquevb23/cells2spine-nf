name: Stub-run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  stub-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.2"   # pin to the version used in development

      - name: Run pipeline stub test
        run: |
          nextflow run main.nf \
            -stub-run \
            -profile stub \
            -params-file tests/configs/test_l3_stub.json \
            --outdir results_ci

      - name: Verify all processes completed
        run: |
          # Nextflow exits 0 on success; this step only runs if the above passed.
          echo "Stub run completed successfully."
